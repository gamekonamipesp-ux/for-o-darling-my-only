<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Aqila 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap">
<style>
:root{--bg:#C9CDD3;--ink:#1F2228;--rose:#2E333B;--soft:rgba(255,255,255,.55);--gold:#F5A623;--cake:#6B7280;--icing:#F3F4F6;--glass:rgba(255,255,255,.32);--edge:rgba(255,255,255,.6);--heart:#fff;--b1:#F5F6F8;--b2:#9CA3AF;--b3:#6B7280;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#23262C;--ink:#F2F4F7;--rose:#E6E9EE;--soft:rgba(255,255,255,.25);--cake:#9AA1AD;--icing:#E5E7EB;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.22);--b1:#4B5563;--b2:#9CA3AF;--b3:#1F2937}}
:root[data-theme="dark"]{--bg:#23262C;--ink:#F2F4F7;--rose:#E6E9EE;--soft:rgba(255,255,255,.25);--cake:#9AA1AD;--icing:#E5E7EB;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.22);--b1:#4B5563;--b2:#9CA3AF;--b3:#1F2937}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;text-align:center}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.9;animation:drift 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;left:-15vmax;top:-10vmax;background:var(--b1)}
.bg i:nth-child(2){width:55vmax;height:55vmax;right:-15vmax;top:30%;background:var(--b2);animation-duration:21s;animation-delay:-6s}
.bg i:nth-child(3){width:50vmax;height:50vmax;left:10%;bottom:-20vmax;background:var(--b3);animation-duration:25s;animation-delay:-3s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{width:100%;max-width:440px;padding:28px 18px 48px;margin:auto}
.glass,.msg,input,button{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 30px rgba(0,0,0,.12)}
.glass{border-radius:28px;padding:28px 20px;margin-bottom:18px}
svg{width:190px;height:auto}
h1{font-family:'Dancing Script',cursive;font-size:clamp(3.4rem,18vw,5rem);margin:.1em 0 .2em;color:var(--rose);line-height:1}
.sub{margin:0 0 20px;font-size:1.05rem;line-height:1.5}
button{font:inherit;font-weight:600;color:var(--ink);border-radius:999px;padding:14px 28px;min-height:48px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
input{font:inherit;font-size:1.3rem;letter-spacing:.3em;text-align:center;width:100%;max-width:260px;min-height:52px;border-radius:14px;color:var(--ink);margin-bottom:16px}
#err{color:var(--rose);min-height:1.5em;margin:0 0 12px;font-weight:600}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite alternate}
.out .flame{animation:none;opacity:0;transition:opacity .4s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.12) rotate(4deg)}}
#msgs{margin:0 0 16px}
.msg{border-radius:22px;padding:12px;margin:14px 0;line-height:1.7;text-align:left;animation:in .5s ease both}
.msg img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover;border-radius:14px;margin-bottom:12px}
.msg p{margin:0 4px 4px;white-space:pre-line}
.msg.sign{font-family:'Dancing Script',cursive;font-size:1.8rem;color:var(--rose);text-align:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.heart,.tap{position:fixed;color:var(--heart);pointer-events:none;text-shadow:0 0 10px rgba(255,255,255,.8);z-index:5}
.heart{bottom:-30px;animation:up 4s linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
.tap{transform:translate(-50%,-50%);animation:tap 1.2s ease-out both}
@keyframes tap{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% - 110px)) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
  <section id="lock" class="glass">
    <svg viewBox="0 0 200 190" aria-hidden="true"><path d="M100 165 C20 110 30 45 75 45 C90 45 98 55 100 62 C102 55 110 45 125 45 C170 45 180 110 100 165Z" fill="var(--rose)"/></svg>
    <h1>Kejutan</h1>
    <p class="sub">Ada sesuatu yang spesial buat kamu. Masukkan kata sandi untuk membukanya.<br>Petunjuk: tanggal lahirmu, tanpa pemisah (hhbbtttt).</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Kata sandi" maxlength="12">
    <p id="err" role="alert"></p>
    <button id="ub">Buka kejutan</button>
  </section>
  <section id="app" hidden>
    <div id="stage" class="glass">
      <svg viewBox="0 0 200 190" aria-hidden="true">
        <ellipse cx="100" cy="172" rx="88" ry="10" fill="var(--soft)"/>
        <rect x="34" y="118" width="132" height="50" rx="10" fill="var(--cake)"/>
        <rect x="34" y="104" width="132" height="24" rx="12" fill="var(--icing)"/>
        <rect x="96" y="72" width="8" height="34" rx="3" fill="var(--gold)"/>
        <path class="flame" d="M100 40 C111 54 109 66 100 69 C91 66 89 54 100 40Z" fill="var(--gold)"/>
      </svg>
      <p class="sub">Selamat ulang tahun</p>
      <h1>Aqila</h1>
      <p class="sub" id="hint">Tutup mata, buat satu permintaan, lalu tiup lilinnya.</p>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <button id="b">Tiup lilin</button>
  </section>
</main>

const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
let PESAN=[],step=0,i=0;
const DARI="dari orang yang mengagumimu, Rasyaa";
async function tryOpen(){
  const v=$('pw').value.trim();$('err').textContent='';
  if(!v){$('err').textContent='Isi kata sandi dulu.';return;}
  $('ub').disabled=true;$('ub').textContent='Membuka...';
  try{PESAN=await unlock(v);$('lock').hidden=true;$('app').hidden=false;}
  catch(e){$('err').textContent='Kata sandi salah. Coba lagi.';$('ub').disabled=false;$('ub').textContent='Buka kejutan';}
}
$('ub').onclick=tryOpen;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen();});
function hearts(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let n=0;n<24;n++){
    const h=document.createElement('span');h.className='heart';h.textContent='♥';
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(14+Math.random()*22)+'px';
    h.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),5500);
  }
}
document.addEventListener('pointerdown',e=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let n=0;n<5;n++){const h=document.createElement('span');h.className='tap';h.textContent='♥';
    h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';h.style.setProperty('--dx',(Math.random()*90-45)+'px');
    h.style.fontSize=(14+Math.random()*16)+'px';h.style.animationDelay=(n*60)+'ms';
    document.body.appendChild(h);setTimeout(()=>h.remove(),1600);}
});
$('b').onclick=()=>{
  const b=$('b');
  if(step===0){
    $('stage').classList.add('out');hearts();
    $('hint').textContent="Permintaanmu sudah terkirim. Ada beberapa pesan untukmu.";
    b.textContent="Buka pesan";step=1;return;
  }
  const m=PESAN[i++],d=document.createElement('div');d.className='msg';
  const im=document.createElement('img');im.src=m.i;im.alt='';
  d.append(im);if(m.t){const p=document.createElement('p');p.textContent=m.t;d.append(p);}$('msgs').appendChild(d);
  b.textContent="Pesan berikutnya";
  if(i===PESAN.length){
    b.hidden=true;
    const s=document.createElement('p');s.className='msg sign';s.textContent="— "+DARI+" ♥";$('msgs').appendChild(s);
    hearts();
  }
  d.scrollIntoView({behavior:'smooth',block:'center'});
};
</script>
